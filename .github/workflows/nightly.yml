name: Nightly

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          # Use the runner's current command-line tools. Revision 12.0's
          # download archive now returns 404 on GitHub-hosted runners.

      - name: Install Android 17 SDK
        shell: bash
        run: |
          sdkmanager --list --channel=3 > /tmp/sdk-packages.txt
          echo "Android 17 SDK candidates:"
          grep -Ei 'cinnamon|platforms;android-37|build-tools;37' /tmp/sdk-packages.txt || true

          PLATFORM_PACKAGE="$(awk -F'|' '
            BEGIN { IGNORECASE=1 }
            {
              path=$1; desc=$3
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", path)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", desc)
              if (path ~ /^platforms;/ && (path ~ /cinnamon|android-37/ || desc ~ /cinnamon|platform 37/)) {
                print path
                exit
              }
            }
          ' /tmp/sdk-packages.txt)"

          BUILD_TOOLS_PACKAGE="$(awk -F'|' '
            {
              path=$1
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", path)
              if (path ~ /^build-tools;37/) print path
            }
          ' /tmp/sdk-packages.txt | sort -V | tail -n1)"

          if [[ -z "$PLATFORM_PACKAGE" ]]; then
            echo "Could not find Android 17/Cinnamon Bun platform package. Available platforms:" >&2
            grep -E '^[[:space:]]*platforms;' /tmp/sdk-packages.txt | tail -n 30 >&2 || true
            exit 1
          fi
          if [[ -z "$BUILD_TOOLS_PACKAGE" ]]; then
            echo "Could not find Build Tools 37 package." >&2
            exit 1
          fi

          echo "Installing $PLATFORM_PACKAGE and $BUILD_TOOLS_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE" "$BUILD_TOOLS_PACKAGE"

          PLATFORM_ID="${PLATFORM_PACKAGE#platforms;}"
          if [[ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" && -d "$ANDROID_SDK_ROOT/platforms/$PLATFORM_ID" ]]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/$PLATFORM_ID" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Robolectric runtime SDKs
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-sdk-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts', 'app/src/test/**/*.kt', '.github/workflows/nightly.yml') }}
          restore-keys: robolectric-sdk-${{ runner.os }}-

      - name: Provision Robolectric Android 14 runtime
        shell: bash
        run: |
          set -euo pipefail
          version=14-robolectric-10818077-i7
          artifact="android-all-instrumented-$version.jar"
          relative="org/robolectric/android-all-instrumented/$version"
          dest="$HOME/.m2/repository/$relative"
          mkdir -p "$dest"
          if [[ -s "$dest/$artifact" ]] && jar tf "$dest/$artifact" > /dev/null; then
            echo "Using cached Robolectric Android 14 SDK"
            exit 0
          fi
          rm -f "$dest/$artifact"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          fetch() {
            curl --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              --connect-timeout 15 --max-time 180 "$1" -o "$2"
          }
          for base in https://repo.maven.apache.org/maven2 https://maven-central.storage-download.googleapis.com/maven2; do
            url="$base/$relative/$artifact"
            echo "Fetching Robolectric SDK from $base"
            if fetch "$url.sha512" "$tmp/checksum" && fetch "$url" "$tmp/$artifact"; then
              checksum="$(tr -d '\r\n' < "$tmp/checksum" | awk '{print $1}')"
              if [[ "$checksum" =~ ^[0-9a-fA-F]{128}$ ]] &&
                 printf '%s  %s\n' "$checksum" "$tmp/$artifact" | sha512sum --check --status &&
                 jar tf "$tmp/$artifact" > /dev/null; then
                mv "$tmp/$artifact" "$dest/$artifact"
                echo "Verified Robolectric SDK installed"
                exit 0
              fi
              echo "SDK checksum or archive validation failed for $base" >&2
            fi
          done
          echo "Unable to provision verified Robolectric SDK" >&2
          exit 1

      - name: Build installable Nightly APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean testDebugUnitTest assembleDebug lintDebug
          cp app/build/outputs/apk/debug/app-debug.apk oos-launcher-customizer-nightly.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: oos-launcher-customizer-nightly
          path: |
            oos-launcher-customizer-nightly.apk
            app/build/reports/pixel17/*.png
          if-no-files-found: error

